[package]
name = "qperf"
edition.workspace = true
publish.workspace = true

#
# We only want this package to build as an extra test. To do this, set each
# binary to build only when the extra_test feature is set. We also mark all
# dependencies as optional so they are normally ignored and required only for
# the extra_test feature.
#

[features]
extra_tests = [
    "dep:anyhow", 
    "dep:clap", 
    "dep:env_logger",
    "dep:futures",
    "dep:log",
    "dep:quiche",
    "dep:rand",
    "dep:rcgen",
    "dep:serde_json",
    "dep:smol"
]

[[bin]]
name = "qperf"
path = "src/main.rs"
required-features = ["extra_tests"]

[[bin]]
name = "qperf_check"
path = "src/check.rs"
required-features = ["extra_tests"]

[dependencies]
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
env_logger = { version = "0.11", optional = true }
futures ={ version =  "0.3", optional = true }
log = { version = "0.4", optional = true }
quiche = { version = "0.30", features = ["qlog"], optional = true }
rand = { version = "0.10", optional = true }
rcgen = { version = "0.14", optional = true }
serde_json = { version = "1.0", optional = true }
smol = { version = "2.0", optional = true }
